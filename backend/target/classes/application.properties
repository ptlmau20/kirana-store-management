spring.application.name=kirana-backend
server.port=${PORT:8080}

# Database Configuration (PostgreSQL default overrideable via env vars, with H2 Postgres mode fallback)
spring.datasource.url=jdbc:postgresql://localhost:5432/kirana
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=2004

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console for local debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Application Security Properties
kirana.jwt.secret=${JWT_SECRET:KiranaStoreSuperSecretSecurityJwtSigningKey2026SecureProductionTokenHeaderSecretKey}
kirana.jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}
kirana.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Security Logging Configuration
logging.level.root=INFO
logging.level.com.kirana.store=INFO
logging.level.org.springframework.security=WARN
